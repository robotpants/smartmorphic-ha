      paper-font-caption_-_font-family:          "DM Sans, system-ui, -apple-system, sans-serif"

      # =========================================================================
      # Smartmorphic custom tokens — dark mode
      # =========================================================================

      # ---- Accent ----
      smartmorphic-accent:             "#e8653a"
      smartmorphic-accent-glow:        "rgba(232,101,58,0.35)"
      smartmorphic-accent-glow-tight:  "rgba(232,101,58,0.55)"

      # ---- Neumorphic shadow recipes (dark — near-imperceptible
      # highlight, deep black low-side; depth lives in the dark side)
      smartmorphic-neu-raised: >-
        3px 3px 8px rgba(0,0,0,0.55),
        -1.5px -1.5px 4px rgba(255,255,255,0.05)
      smartmorphic-neu-raised-sm: >-
        2px 2px 5px rgba(0,0,0,0.50),
        -1px -1px 3px rgba(255,255,255,0.04)
      smartmorphic-neu-raised-lg: >-
        5px 5px 14px rgba(0,0,0,0.60),
        -2px -2px 8px rgba(255,255,255,0.06)
      smartmorphic-neu-pressed: >-
        inset 2px 2px 4px rgba(0,0,0,0.60),
        inset -1px -1px 2px rgba(255,255,255,0.05)
      smartmorphic-neu-pressed-sm: >-
        inset 1.5px 1.5px 3px rgba(0,0,0,0.55),
        inset -1px -1px 2px rgba(255,255,255,0.04)

      # ---- Off-state tint ----
      smartmorphic-off-tint: "rgba(125,128,146,0.10)"

      # ---- Surface ----
      smartmorphic-surface:    "#1d1f27"
      smartmorphic-bg:         "#14151b"

      # ---- Radii (export scale) ----
      smartmorphic-radius:       "16px"
      smartmorphic-radius-sm:    "8px"
      smartmorphic-radius-md:    "12px"
      smartmorphic-radius-lg:    "18px"
      smartmorphic-radius-xl:    "24px"
      smartmorphic-radius-pill:  "999px"

      # ---- Type ----
      smartmorphic-font-body:    "DM Sans, system-ui, -apple-system, sans-serif"
      smartmorphic-font-display: "Outfit, 'DM Sans', system-ui, -apple-system, sans-serif"
      smartmorphic-font-mono:    "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"

      # ---- Eyebrow ----
      smartmorphic-eyebrow-font-family:     "Outfit, 'DM Sans', system-ui, -apple-system, sans-serif"
      smartmorphic-eyebrow-font-size:       "10px"
      smartmorphic-eyebrow-font-weight:     "600"
      smartmorphic-eyebrow-letter-spacing:  "1.5px"
      smartmorphic-eyebrow-text-transform:  "uppercase"
      smartmorphic-eyebrow-color:           "#5e6070"

      # ---- Spacing scale ----
      smartmorphic-space-1: "4px"
      smartmorphic-space-2: "6px"
      smartmorphic-space-3: "8px"
      smartmorphic-space-4: "12px"
      smartmorphic-space-5: "16px"
      smartmorphic-space-6: "24px"

      # ---- Motion ----
      smartmorphic-transition-fast:   "120ms ease"
      smartmorphic-transition-base:   "180ms ease"
      smartmorphic-transition-slow:   "240ms ease"
      smartmorphic-ease-spring:       "cubic-bezier(0.25,0.46,0.45,0.94)"
      smartmorphic-transition-spring: "0.25s cubic-bezier(0.25,0.46,0.45,0.94)"

      # ---- Color palette ----
      smartmorphic-color-amber:  "#e8b83a"
      smartmorphic-color-green:  "#3abf7a"
      smartmorphic-color-blue:   "#3a8ee8"
      smartmorphic-color-purple: "#9b59b6"
      smartmorphic-color-pink:   "#e84a7a"
      smartmorphic-color-teal:   "#3abfb8"

      # ---- Chart palette ----
      smartmorphic-chart-color-1: "#e8653a"
      smartmorphic-chart-color-2: "#3a8ee8"
      smartmorphic-chart-color-3: "#3abf7a"
      smartmorphic-chart-color-4: "#e84a7a"
      smartmorphic-chart-color-5: "#9b59b6"
      smartmorphic-chart-color-6: "#e8b83a"

      # =========================================================================
      # Mushroom card overrides — dark
      # =========================================================================
      mush-rgb-card: "29,31,39"
      mush-card-primary-font-size:    "14px"
      mush-card-primary-font-weight:  "600"
      mush-card-primary-line-height:  "1.2"
      mush-card-secondary-font-size:  "11px"
      mush-card-secondary-font-weight: "500"
      mush-card-secondary-line-height: "1.4"
      mush-title-font-weight:         "600"
