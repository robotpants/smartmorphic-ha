# =============================================================================
# Smartmorphic — Home Assistant theme
#
# Source of truth for visual style:
#   `style-guide` branch → design_handoff_smartmorphic_theme/{tokens.md,
#   starter-theme.yaml, components.md}
#
# Principles:
#   1. Light mode: single surface — page bg == card bg. Depth from paired
#      shadows only.
#   2. Dark mode: surface lifts ~6 luminance points above bg so cards
#      register against a darker page. Shadow highlight is near-invisible
#      (~0.025 alpha) — depth comes mostly from the deep black side.
#   3. Three depth levels (raised, raised-sm, raised-lg) + pressed.
#   4. Ember accent (#e8653a) reserved for active/focus/brand states.
#
# Companion install (all via HACS, recommended):
#   - card-mod              CSS injection into card internals
#   - mushroom              card pack used by the starter dashboard
# =============================================================================

Smartmorphic:
  modes:
    # =========================================================================
    # LIGHT
    # =========================================================================
    light:
      # ---- Brand / accent ----
      primary-color:        "#e8653a"
      accent-color:         "#e8653a"
      dark-primary-color:   "#c5512c"
      light-primary-color:  "#f0a050"
      text-primary-color:   "#ffffff"

      # ---- Surfaces (single-surface principle) ----
      primary-background-color:    "#e2e4ec"
      secondary-background-color:  "#e2e4ec"
      card-background-color:       "#e2e4ec"
      ha-card-background:          "#e2e4ec"
      paper-card-background-color: "#e2e4ec"
      paper-listbox-background-color: "#e2e4ec"
      paper-dialog-background-color:  "#e2e4ec"
      mdc-theme-surface:           "#e2e4ec"
      mdc-dialog-scrim-color:      "rgba(26,27,34,0.45)"
      table-row-background-color:  "#e2e4ec"
      table-row-alternative-background-color: "#dadce4"
      lovelace-background:         "#e2e4ec"

      # App header
      app-header-background-color:      "#e2e4ec"
      app-header-text-color:            "#2c2e3a"
      app-header-edit-background-color: "#e2e4ec"
      app-header-selection-bar-color:   "#e8653a"

      # Sidebar
      sidebar-background-color:           "#e2e4ec"
      sidebar-text-color:                 "#6b6e7d"
      sidebar-icon-color:                 "#6b6e7d"
      sidebar-selected-background-color:  "#e2e4ec"
      sidebar-selected-text-color:        "#e8653a"
      sidebar-selected-icon-color:        "#e8653a"

      # ---- Text ----
      primary-text-color:        "#2c2e3a"
      secondary-text-color:      "#6b6e7d"
      disabled-text-color:       "#7d8092"
      text-color:                "#2c2e3a"
      text-medium-emphasis-color: "#6b6e7d"

      # ---- Cards ----
      ha-card-border-radius: "16px"
      ha-card-border-width:  "0"
      ha-card-border-color:  "transparent"
      ha-card-box-shadow: >-
        3px 3px 8px rgba(163,167,185,0.40),
        -3px -3px 8px rgba(255,255,255,0.85)
      ha-card-header-color:        "#2c2e3a"
      ha-card-header-font-family:  "DM Sans, system-ui, -apple-system, sans-serif"
      ha-card-header-font-weight:  "600"
      ha-card-header-font-size:    "14px"

      # ---- Icons / states ----
      state-icon-color:             "#6b6e7d"
      state-icon-active-color:      "#e8653a"
      state-icon-unavailable-color: "#7d8092"
      state-icon-error-color:       "#e84a3a"

      # ---- Switches ----
      switch-checked-color:                  "#e8653a"
      switch-checked-button-color:           "#ffffff"
      switch-checked-track-color:            "#e8653a"
      switch-unchecked-color:                "#c4c7d4"
      switch-unchecked-button-color:         "#ffffff"
      switch-unchecked-track-color:          "#c4c7d4"
      paper-toggle-button-checked-button-color:   "#ffffff"
      paper-toggle-button-checked-bar-color:      "#e8653a"
      paper-toggle-button-unchecked-button-color: "#ffffff"
      paper-toggle-button-unchecked-bar-color:    "#c4c7d4"
      mdc-switch-selected-track-color:       "#e8653a"
      mdc-switch-unselected-track-color:     "#c4c7d4"
      mdc-switch-selected-handle-color:      "#ffffff"
      mdc-switch-unselected-handle-color:    "#ffffff"

      # ---- Sliders ----
      paper-slider-knob-color:        "#ffffff"
      paper-slider-knob-start-color:  "#ffffff"
      paper-slider-pin-color:         "#e8653a"
      paper-slider-active-color:      "#e8653a"
      paper-slider-secondary-color:   "rgba(232,101,58,0.35)"
      paper-slider-container-color:   "#e2e4ec"
      ha-slider-thumb-color:          "#ffffff"
      ha-slider-track-color:          "#c4c7d4"
      ha-slider-active-color:         "#e8653a"

      # ---- Buttons / mdc ----
      mdc-theme-primary:           "#e8653a"
      mdc-theme-on-primary:        "#ffffff"
      mdc-theme-secondary:         "#e8653a"
      mdc-button-outline-color:    "rgba(125,128,146,0.20)"
      mdc-icon-button-size:        "44px"
      mdc-ripple-press-opacity:    "0.12"
      paper-item-icon-color:       "#6b6e7d"
      paper-item-icon-active-color: "#e8653a"
      paper-item-selected-color:   "rgba(232,101,58,0.12)"

      # ---- Status / semantic ----
      success-color: "#3abf7a"
      warning-color: "#e8b83a"
      error-color:   "#e84a3a"
      info-color:    "#3a8ee8"
      state-on-color:      "#3abf7a"
      state-active-color:  "#3abf7a"
      state-warning:       "#e8b83a"
      state-error-color:   "#e84a3a"
      label-badge-green:   "#3abf7a"
      label-badge-yellow:  "#e8b83a"
      label-badge-red:     "#e84a3a"
      label-badge-blue:    "#3a8ee8"
      label-badge-grey:    "#7d8092"
      label-badge-background-color: "#e2e4ec"
      label-badge-text-color:       "#2c2e3a"

      # ---- Dividers / outlines ----
      divider-color:                  "rgba(125,128,146,0.10)"
      outline-color:                  "rgba(125,128,146,0.18)"
      input-fill-color:               "#e2e4ec"
      input-ink-color:                "#2c2e3a"
      input-label-ink-color:          "#6b6e7d"
      input-idle-line-color:          "rgba(125,128,146,0.18)"
      input-hover-line-color:         "rgba(125,128,146,0.30)"
      paper-input-container-color:    "#6b6e7d"
      paper-input-container-focus-color: "#e8653a"
      ha-textfield-bg-color:          "transparent"

      # ---- Code / markdown ----
      code-editor-background-color:  "#e2e4ec"
      codemirror-keyword:            "#e8653a"
      codemirror-string:             "#3abf7a"
      codemirror-number:             "#3a8ee8"
      codemirror-comment:            "#7d8092"
      markdown-code-background-color: "rgba(163,167,185,0.15)"

      # ---- More-info dialog ----
      ha-dialog-border-radius: "24px"
      mdc-dialog-shape-radius: "24px"

      # ---- Tabs ----
      paper-tabs-selection-bar-color: "#e8653a"

      # ---- Misc HA chrome ----
      paper-listbox-color:                "#2c2e3a"
      paper-menu-button-background-color: "#e2e4ec"
      rgb-primary-color:                  "232,101,58"
      rgb-accent-color:                   "232,101,58"

      # ---- Charts ----
      chart-background-color: "#e2e4ec"
      history-unavailable:    "rgba(125,128,146,0.20)"
      history-unknown:        "rgba(125,128,146,0.10)"

      # ---- Energy dashboard ----
      energy-grid-consumption-color: "#7d8092"
      energy-grid-return-color:      "#3abf7a"
      energy-solar-color:            "#e8b83a"
      energy-battery-out-color:      "#e8653a"
      energy-battery-in-color:       "#3abf7a"
      energy-non-fossil-color:       "#3a8ee8"
      energy-gas-color:              "#e84a3a"
      energy-water-color:            "#3a8ee8"

      # ---- Fonts ----
      primary-font-family:                       "DM Sans, system-ui, -apple-system, sans-serif"
      paper-font-common-base_-_font-family:      "DM Sans, system-ui, -apple-system, sans-serif"
      paper-font-common-code_-_font-family:      "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
      paper-font-body1_-_font-family:            "DM Sans, system-ui, -apple-system, sans-serif"
      paper-font-subhead_-_font-family:          "DM Sans, system-ui, -apple-system, sans-serif"
      paper-font-headline_-_font-family:         "Outfit, system-ui, -apple-system, sans-serif"
      paper-font-title_-_font-family:            "Outfit, system-ui, -apple-system, sans-serif"
      paper-font-caption_-_font-family:          "DM Sans, system-ui, -apple-system, sans-serif"

      # =========================================================================
      # Smartmorphic custom tokens — light mode
      # =========================================================================

      # ---- Accent ----
      smartmorphic-accent:             "#e8653a"
      smartmorphic-accent-glow:        "rgba(232,101,58,0.35)"
      smartmorphic-accent-glow-tight:  "rgba(232,101,58,0.55)"

      # ---- Neumorphic shadow recipes (export-aligned: tighter offsets,
      # cleaner highlight). Values inlined here per mode so the composite
      # carries the correct primitives.
      smartmorphic-neu-raised: >-
        3px 3px 8px rgba(163,167,185,0.40),
        -3px -3px 8px rgba(255,255,255,0.85)
      smartmorphic-neu-raised-sm: >-
        2px 2px 5px rgba(163,167,185,0.35),
        -2px -2px 5px rgba(255,255,255,0.75)
      smartmorphic-neu-raised-lg: >-
        5px 5px 14px rgba(163,167,185,0.42),
        -5px -5px 14px rgba(255,255,255,0.85)
      smartmorphic-neu-pressed: >-
        inset 2px 2px 4px rgba(163,167,185,0.40),
        inset -2px -2px 4px rgba(255,255,255,0.70)
      smartmorphic-neu-pressed-sm: >-
        inset 1.5px 1.5px 3px rgba(163,167,185,0.35),
        inset -1.5px -1.5px 3px rgba(255,255,255,0.60)

      # ---- Off-state tint (for flat icon wells when not active) ----
      smartmorphic-off-tint: "rgba(125,128,146,0.10)"

      # ---- Surface ----
      smartmorphic-surface:    "#e2e4ec"
      smartmorphic-bg:         "#e2e4ec"

      # ---- Radii (export scale) ----
      smartmorphic-radius:       "16px"
      smartmorphic-radius-sm:    "8px"
      smartmorphic-radius-md:    "12px"
      smartmorphic-radius-lg:    "18px"
      smartmorphic-radius-xl:    "24px"
      smartmorphic-radius-pill:  "999px"

      # ---- Type ----
      smartmorphic-font-body:    "DM Sans, system-ui, -apple-system, sans-serif"
      smartmorphic-font-display: "Outfit, 'DM Sans', system-ui, -apple-system, sans-serif"
      smartmorphic-font-mono:    "JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace"

      # ---- Eyebrow text (small-caps section labels) ----
      smartmorphic-eyebrow-font-family:     "Outfit, 'DM Sans', system-ui, -apple-system, sans-serif"
      smartmorphic-eyebrow-font-size:       "10px"
      smartmorphic-eyebrow-font-weight:     "600"
      smartmorphic-eyebrow-letter-spacing:  "1.5px"
      smartmorphic-eyebrow-text-transform:  "uppercase"
      smartmorphic-eyebrow-color:           "#7d8092"

      # ---- Spacing scale ----
      smartmorphic-space-1: "4px"
      smartmorphic-space-2: "6px"
      smartmorphic-space-3: "8px"
      smartmorphic-space-4: "12px"
      smartmorphic-space-5: "16px"
      smartmorphic-space-6: "24px"

      # ---- Motion ----
      smartmorphic-transition-fast:   "120ms ease"
      smartmorphic-transition-base:   "180ms ease"
      smartmorphic-transition-slow:   "240ms ease"
      smartmorphic-ease-spring:       "cubic-bezier(0.25,0.46,0.45,0.94)"
      smartmorphic-transition-spring: "0.25s cubic-bezier(0.25,0.46,0.45,0.94)"

      # ---- Color palette ----
      smartmorphic-color-amber:  "#e8b83a"
      smartmorphic-color-green:  "#3abf7a"
      smartmorphic-color-blue:   "#3a8ee8"
      smartmorphic-color-purple: "#9b59b6"
      smartmorphic-color-pink:   "#e84a7a"
      smartmorphic-color-teal:   "#3abfb8"

      # ---- Chart palette ----
      smartmorphic-chart-color-1: "#e8653a"
      smartmorphic-chart-color-2: "#3a8ee8"
      smartmorphic-chart-color-3: "#3abf7a"
      smartmorphic-chart-color-4: "#e84a7a"
      smartmorphic-chart-color-5: "#9b59b6"
      smartmorphic-chart-color-6: "#e8b83a"

      # =========================================================================
      # Mushroom card overrides
      # =========================================================================
      mush-rgb-card: "226,228,236"
      mush-card-primary-font-size:    "14px"
      mush-card-primary-font-weight:  "600"
      mush-card-primary-line-height:  "1.2"
      mush-card-secondary-font-size:  "11px"
      mush-card-secondary-font-weight: "500"
      mush-card-secondary-line-height: "1.4"
      mush-title-font-weight:         "600"
      mush-title-font-size:           "22px"
      mush-title-letter-spacing:      "-0.5px"
      mush-subtitle-font-weight:      "500"
      mush-subtitle-font-size:        "12px"
      mush-icon-border-radius:        "12px"
      mush-icon-size:                 "38px"
      mush-icon-symbol-size:          "20px"
      mush-control-border-radius:     "12px"
      mush-control-height:            "40px"
      mush-control-icon-size:         "18px"
      mush-slider-color:              "#e8653a"
      mush-rgb-state-light:    "232,101,58"
      mush-rgb-state-fan:      "58,191,184"
      mush-rgb-state-entity:   "232,101,58"
      mush-rgb-state-cover:    "232,184,58"
      mush-rgb-state-climate:  "232,101,58"
      mush-rgb-disabled:       "125,128,146"
      mush-rgb-purple:    "155,89,182"
      mush-rgb-pink:      "232,74,122"
      mush-rgb-red:       "232,74,58"
      mush-rgb-deep-orange: "240,160,80"
      mush-rgb-orange:    "232,101,58"
      mush-rgb-amber:     "232,184,58"
      mush-rgb-yellow:    "240,220,80"
      mush-rgb-lime:      "180,220,80"
      mush-rgb-green:     "58,191,122"
      mush-rgb-teal:      "58,191,184"
      mush-rgb-cyan:      "100,200,220"
      mush-rgb-light-blue: "120,180,232"
      mush-rgb-blue:      "58,142,232"
      mush-rgb-indigo:    "100,100,200"
      mush-rgb-deep-purple: "120,80,180"
      mush-rgb-grey:      "125,128,146"
      mush-rgb-blue-grey: "120,130,150"
      mush-rgb-brown:     "150,100,80"

      # =========================================================================
      # card-mod theme — pushes CSS into card internals
      # =========================================================================
      card-mod-theme: Smartmorphic

      card-mod-root-yaml: |
        .: |
          ::-webkit-scrollbar { width: 10px; height: 10px; }
          ::-webkit-scrollbar-track { background: transparent; }
          ::-webkit-scrollbar-thumb {
            background: rgba(125,128,146,0.35);
            border-radius: 999px;
            border: 2px solid transparent;
            background-clip: content-box;
          }
          ::-webkit-scrollbar-thumb:hover {
            background: rgba(125,128,146,0.55);
            background-clip: content-box;
          }
          *:focus-visible {
            outline: 2px solid var(--smartmorphic-accent);
            outline-offset: 3px;
            border-radius: 4px;
          }

      card-mod-card-yaml: |
        .: |
          ha-card {
            transition: box-shadow 0.25s cubic-bezier(0.25,0.46,0.45,0.94);
            border-radius: var(--smartmorphic-radius) !important;
          }
          /* Inner icon wells inside HA built-ins — flat tinted off, accent on */
          ha-card .icon, ha-card state-badge {
            border-radius: var(--smartmorphic-radius-md);
            padding: 6px;
            background: var(--smartmorphic-off-tint);
            box-shadow: none;
            transition: background 0.2s, color 0.2s, box-shadow 0.2s;
          }
          ha-card .state-badge ha-state-icon[data-state="on"],
          ha-card .icon[data-state="on"] {
            color: var(--smartmorphic-accent) !important;
            background: var(--smartmorphic-accent-glow);
            box-shadow:
              inset 0 1px 0 rgba(255,255,255,0.18),
              0 0 0 1px var(--smartmorphic-accent-glow);
          }
          /* Tile-card primary text uses DM Sans / 14 / 600 */
          hui-tile-card .primary,
          ha-tile-info .primary {
            font-family: 'DM Sans', system-ui, sans-serif !important;
            font-weight: 600 !important;
            letter-spacing: 0;
          }
          hui-tile-card .secondary,
          ha-tile-info .secondary {
            font-weight: 500 !important;
            font-size: 11px !important;
            color: var(--secondary-text-color) !important;
          }
          /* Tile card icons: no drop-shadow filter (forbidden per style guide) */
          hui-tile-card ha-tile-icon {
            transition: filter 0.25s ease-out, transform 0.15s ease-out;
          }
          hui-tile-card:active ha-tile-icon {
            transform: scale(0.95);
          }
          mushroom-state-info .primary,
          mushroom-card .primary {
            font-family: 'DM Sans', system-ui, sans-serif !important;
            font-weight: 600 !important;
          }
          ha-card hui-entities-toggle,
          ha-card .divider, ha-card hr {
            background: var(--divider-color) !important;
          }
          ha-card mwc-button[outlined],
          ha-card mwc-button[unelevated] {
            --mdc-shape-small: 12px;
            --mdc-button-outline-width: 0;
            box-shadow: var(--smartmorphic-neu-raised-sm);
          }
          ha-card mwc-button:active {
            box-shadow: var(--smartmorphic-neu-pressed-sm);
          }

      card-mod-more-info-yaml: |
        .: |
          ha-dialog {
            --mdc-shape-medium: var(--smartmorphic-radius-xl);
            --mdc-dialog-min-width: 360px;
          }
          ha-dialog .mdc-dialog__surface {
            box-shadow: var(--smartmorphic-neu-raised-lg) !important;
            background: var(--ha-card-background);
            border-radius: var(--smartmorphic-radius-xl);
          }

      card-mod-view-yaml: |
        .: |
          hui-view {
            padding: 12px 14px 16px;
          }

    # =========================================================================
    # DARK
    # =========================================================================
    dark:
      # ---- Brand / accent ----
      primary-color:        "#e8653a"
      accent-color:         "#e8653a"
      dark-primary-color:   "#c5512c"
      light-primary-color:  "#f0a050"
      text-primary-color:   "#ffffff"

      # ---- Surfaces (dark mode lifts surface above bg) ----
      primary-background-color:    "#14151b"
      secondary-background-color:  "#1d1f27"
      card-background-color:       "#1d1f27"
      ha-card-background:          "#1d1f27"
      paper-card-background-color: "#1d1f27"
      paper-listbox-background-color: "#1d1f27"
      paper-dialog-background-color:  "#1d1f27"
      mdc-theme-surface:           "#1d1f27"
      mdc-dialog-scrim-color:      "rgba(0,0,0,0.45)"
      table-row-background-color:  "#1d1f27"
      table-row-alternative-background-color: "#22232c"
      lovelace-background:         "#14151b"

      app-header-background-color:      "#14151b"
      app-header-text-color:            "#e4e5eb"
      app-header-edit-background-color: "#1d1f27"
      app-header-selection-bar-color:   "#e8653a"

      sidebar-background-color:           "#1d1f27"
      sidebar-text-color:                 "#9a9caa"
      sidebar-icon-color:                 "#9a9caa"
      sidebar-selected-background-color:  "#1d1f27"
      sidebar-selected-text-color:        "#e8653a"
      sidebar-selected-icon-color:        "#e8653a"

      # ---- Text ----
      primary-text-color:        "#e4e5eb"
      secondary-text-color:      "#9a9caa"
      disabled-text-color:       "#5e6070"
      text-color:                "#e4e5eb"
      text-medium-emphasis-color: "#9a9caa"

      # ---- Cards ----
      ha-card-border-radius: "16px"
      ha-card-border-width:  "0"
      ha-card-border-color:  "transparent"
      ha-card-box-shadow: >-
        3px 3px 8px rgba(0,0,0,0.55),
        -1.5px -1.5px 4px rgba(255,255,255,0.05)
      ha-card-header-color:        "#e4e5eb"
      ha-card-header-font-family:  "DM Sans, system-ui, -apple-system, sans-serif"
      ha-card-header-font-weight:  "600"
      ha-card-header-font-size:    "14px"

      # ---- Icons / states ----
      state-icon-color:             "#9a9caa"
      state-icon-active-color:      "#e8653a"
      state-icon-unavailable-color: "#5e6070"
      state-icon-error-color:       "#e84a3a"

      # ---- Switches ----
      switch-checked-color:           "#e8653a"
      switch-checked-button-color:    "#ffffff"
      switch-checked-track-color:     "#e8653a"
      switch-unchecked-color:         "#3a3d4a"
      switch-unchecked-button-color:  "#ffffff"
      switch-unchecked-track-color:   "#3a3d4a"
      paper-toggle-button-checked-button-color:   "#ffffff"
      paper-toggle-button-checked-bar-color:      "#e8653a"
      paper-toggle-button-unchecked-button-color: "#ffffff"
      paper-toggle-button-unchecked-bar-color:    "#3a3d4a"
      mdc-switch-selected-track-color:    "#e8653a"
      mdc-switch-unselected-track-color:  "#3a3d4a"
      mdc-switch-selected-handle-color:   "#ffffff"
      mdc-switch-unselected-handle-color: "#ffffff"

      # ---- Sliders ----
      paper-slider-knob-color:       "#ffffff"
      paper-slider-knob-start-color: "#ffffff"
      paper-slider-pin-color:        "#e8653a"
      paper-slider-active-color:     "#e8653a"
      paper-slider-secondary-color:  "rgba(232,101,58,0.35)"
      paper-slider-container-color:  "#3a3d4a"
      ha-slider-thumb-color:         "#ffffff"
      ha-slider-track-color:         "#3a3d4a"
      ha-slider-active-color:        "#e8653a"

      # ---- Buttons / mdc ----
      mdc-theme-primary:           "#e8653a"
      mdc-theme-on-primary:        "#ffffff"
      mdc-theme-secondary:         "#e8653a"
      mdc-button-outline-color:    "rgba(125,128,146,0.20)"
      mdc-icon-button-size:        "44px"
      mdc-ripple-press-opacity:    "0.16"
      paper-item-icon-color:       "#9a9caa"
